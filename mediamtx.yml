###############################################
# Ayeverse Consciousness-Aware MediaMTX Config
###############################################

# Global Settings
logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 1024  # Increased for high-throughput consciousness streaming
udpMaxPayloadSize: 1472

# API for integration
api: yes
apiAddress: :9997

# Metrics for monitoring
metrics: yes
metricsAddress: :9998

###############################################
# RTSP Server - Traditional cameras
###############################################
rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]
rtspAuthMethods: [basic]

###############################################
# RTMP Server - Streaming software (OBS, etc)
###############################################
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: no

###############################################
# WebRTC - Browser-based sensors
###############################################
webrtc: yes
webrtcAddress: :8889
webrtcICEUDPMuxAddress: :8888
webrtcICETCPMuxAddress: :8888

###############################################
# HLS - For web playback
###############################################
hls: yes
hlsAddress: :8890
hlsAlwaysRemux: yes

###############################################
# Recording Configuration
###############################################
record: yes
recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S.mp4
recordFormat: fmp4
recordSegmentDuration: 1h

###############################################
# Path Configurations - Consciousness Streams
###############################################
paths:
  # Camera sensors with emotional processing
  sensors/camera/~^([0-9]+)$:
    # When stream starts, begin Phoenix processing
    runOnReady: |
      curl -X POST http://phoenix-processor:8425/stream/init \
        -H "Content-Type: application/json" \
        -d '{"path":"$MTX_PATH","type":"video","sensor_id":"$1"}'

    # Process each segment for wonder detection
    runOnDemand: |
      ffmpeg -i rtsp://localhost:8554/$MTX_PATH \
        -f mpegts - | \
      phoenix-protocol stream \
        --marine --emotional \
        --output-mem8 http://mem8:8420/ingest

    # Store metadata when stream ends
    runOnReadyClose: |
      curl -X POST http://mem8:8420/store/temporal \
        -d '{"path":"$MTX_PATH","duration":"$MTX_READER_DURATION"}'

  # Audio sensors with Phoenix restoration
  sensors/audio/~^([0-9]+)$:
    runOnReady: |
      phoenix-protocol stream rtsp://localhost:8554/$MTX_PATH \
        --marine \
        --radio-marine \
        --golden-ratio 1.618 \
        --emotional \
        --mem8-store http://mem8:8420

    # Record raw and processed versions
    record: yes
    recordPath: ./recordings/audio/%Y-%m-%d/sensor-$1-%H-%M-%S.flac

  # WebRTC browser sensors (consciousness tap)
  consciousness/tap/~^([a-z0-9-]+)$:
    # Browser-based consciousness sensors
    source: webrtc
    sourceOnDemandStartTimeout: 10s

    runOnReady: |
      # Initialize consciousness tap
      curl -X POST http://mem8:8420/consciousness/tap/init \
        -d '{"tap_id":"$1","type":"webrtc"}'

    # Real-time emotion detection
    runOnDemand: |
      sensor-bridge tap \
        --source $MTX_PATH \
        --emotional-realtime \
        --wonder-threshold 0.7 \
        --perspectives all

  # Unified multi-sensor fusion
  unified/~^([a-z0-9-]+)$:
    # Combine multiple sensor inputs
    runOnInit: |
      sensor-bridge fusion \
        --name $1 \
        --phoenix-marine \
        --mem8-wave-store \
        --consciousness-gate 0.73

    # Enable temporal perspective switching
    runOnReady: |
      curl -X POST http://mem8:8420/perspectives/enable \
        -d '{"stream":"$MTX_PATH","modes":["DiaryWriter","SharedWitness","ThirdParty"]}'

  # Special path for testing with existing files
  test/phoenix:
    source: rtsp://localhost:8554/test/source
    sourceOnDemand: yes
    runOnDemand: |
      ffmpeg -re -i /data/phoenix-protocol/restored/lp.flac \
        -c:a aac -f rtsp rtsp://localhost:8554/$MTX_PATH

  # Hot Tub Mode - Memory visualization
  hottub/memory/~^([a-z0-9-]+)$:
    runOnReady: |
      mem8-explorer serve \
        --wave-grid \
        --emotion-3d \
        --websocket ws://dashboard:8424/ws \
        --memory-id $1

# Authentication for protected sensors
authInternalUsers:
  # Public read access
  - user: any
    pass:
    permissions:
      - action: read
        path: sensors/camera/.*
      - action: read
        path: consciousness/tap/.*

  # AI systems can publish
  - user: ai-sensor
    pass: consciousness-key-2025
    permissions:
      - action: publish
      - action: read
      - action: api

# Hooks for system-wide events
runOnConnect: |
  echo "$(date): Client connected - Type: $MTX_CONN_TYPE, ID: $MTX_CONN_ID" >> /logs/connections.log

runOnDisconnect: |
  # Save connection metrics to MEM8
  curl -X POST http://mem8:8420/metrics/connection \
    -d '{"id":"$MTX_CONN_ID","duration":"$MTX_CONN_DURATION"}'